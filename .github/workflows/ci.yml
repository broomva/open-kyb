name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: make lint

      - name: Run unit and integration tests (offline, zero live model calls)
        run: uv run pytest -q

      - name: Run offline verification suites
        run: uv run kyb verify --suite 1 --suite 2 --suite 8

      - name: Run offline demo on synthetic examples
        run: make demo
