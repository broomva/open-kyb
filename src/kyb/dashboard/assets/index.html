<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>open-kyb · Case workspace</title><style>/* DASHBOARD_CSS */</style></head>
<body><canvas id="field" aria-hidden="true"></canvas><div id="app">
<header class="glass lm"><a class="brand km-mt" href="#queue" aria-label="open-kyb review queue">kyb</a>
<span id="workspace">Connecting to your workspace…</span>
<button id="theme" class="icon-control" aria-label="Switch to light mode"><span class="light-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></span><span class="dark-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 13a9 9 0 1 1-10-10 7 7 0 0 0 10 10Z"/></svg></span></button>
<button id="motion" class="icon-control" aria-label="Pause ambient motion"><span class="pause-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></span><span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg></span></button><button id="browser" class="icon-control" aria-label="Open connected browser dashboard" hidden><svg viewBox="0 0 24 24"><path d="M14 4h6v6m0-6L10 14m-1-9H4v15h15v-5"/></svg></button></header>
<div id="connection" class="connection" role="status">Connecting. No review has started.</div>
<div id="notice" role="status" aria-live="polite"></div>
<div class="workspace"><aside id="queue"></aside><main id="main" tabindex="-1">
<p class="kicker">Case workspace</p><h1>Loading cases</h1>
<p>Reading saved case records. This does not start a review.</p></main></div>
<nav class="glass lm" aria-label="Workspace navigation"><button data-view="queue" aria-current="page">Cases</button>
<button data-view="timeline">Activity</button><button data-view="overview">Case review</button></nav>
<footer><span id="updated">Not refreshed yet</span> · <button id="refresh">Refresh records</button></footer>
</div><script id="orb-source" type="x-shader/x-fragment">/* ORB_SHADER */</script>
<script>/* MATERIAL_JS */</script><script>/* DASHBOARD_JS */</script></body></html>
