[project]
name = "open-kyb"
version = "0.1.0"
description = "Autonomous KYB reviewer: models read, code decides (E-p), the record proves."
readme = "README.md"
requires-python = ">=3.15"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.14",
  "mcp>=2.3",
  "typer>=0.27",
]

[project.scripts]
kyb = "kyb.cli:main"
kyb-mcp = "kyb.mcp_server:main"
kyb-hook = "kyb.hook:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyb"]

[tool.ruff]
line-length = 100
target-version = "py315"
extend-exclude = ["src/kyb/contracts/kyb_decision_schema.py"]  # open-kyb's contract stays byte-identical

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["renderer_bound: historical replay requires an admitted renderer"]
